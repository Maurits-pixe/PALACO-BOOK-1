name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile is present on main; retain npm install until a
      # reviewed lockfile enables reproducible npm ci.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
