name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tracked sensitive files
        run: node scripts/check-tracked-sensitive.mjs
      - name: Check declared dependency sources
        run: node scripts/check-dependency-sources.mjs
      - name: Require committed npm lockfile
        run: git ls-files --error-unmatch package-lock.json
      - name: Verify committed lockfile before installation
        run: node scripts/verify-lockfile.mjs
      - name: Record committed lockfile digest
        run: sha256sum package-lock.json > package-lock.sha256
      - name: Install from committed lockfile
        run: npm ci
      - name: Verify dependency metadata after installation
        run: node scripts/verify-lockfile.mjs
      - name: Verify npm ci did not modify lockfile
        run: sha256sum -c package-lock.sha256
      - name: Generate deterministic dependency review inventory
        run: node scripts/build-dependency-inventory.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Collect npm vulnerability audit evidence
        shell: bash
        run: |
          trap 'rm -f npm-audit.raw.json' EXIT
          set +e
          npm audit --json --audit-level=low > npm-audit.raw.json
          audit_exit=$?
          set -e
          node scripts/summarize-npm-audit.mjs "$audit_exit"
      - name: Independently verify clean audit provenance
        run: node scripts/verify-audit-evidence.mjs
      - name: Verify inventory against audit and committed lockfile
        run: node scripts/verify-dependency-inventory.mjs
      - name: Upload dependency inventory for review
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-inventory
          path: npm-dependency-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized npm audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-summary
          path: npm-audit-summary.json
          if-no-files-found: warn
          retention-days: 7
