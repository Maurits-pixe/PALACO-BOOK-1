name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tracked sensitive files
        run: node scripts/check-tracked-sensitive.mjs
      - name: Check declared dependency sources
        run: node scripts/check-dependency-sources.mjs
      - name: Detect committed npm lockfile
        id: lock
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify committed lockfile before installation
        if: steps.lock.outputs.committed == 'true'
        run: node scripts/verify-lockfile.mjs
      - name: Install reproducibly from committed lockfile
        if: steps.lock.outputs.committed == 'true'
        run: npm ci
      - name: Install and generate review-only lockfile candidate
        if: steps.lock.outputs.committed == 'false'
        run: npm install --package-lock=true
      - name: Verify installed dependency lock metadata
        run: node scripts/verify-lockfile.mjs
      - name: Exercise npm ci against generated candidate
        if: steps.lock.outputs.committed == 'false'
        run: npm ci
      - name: Check lockfile again after npm ci
        run: node scripts/verify-lockfile.mjs
      - name: Record lockfile candidate digest
        if: steps.lock.outputs.committed == 'false'
        shell: bash
        run: |
          sha256sum package-lock.json > package-lock.sha256
          echo "Lockfile candidate digest:"
          cat package-lock.sha256
      - name: Verify generated lockfile digest after npm ci
        if: steps.lock.outputs.committed == 'false'
        run: sha256sum -c package-lock.sha256
      - name: Upload uncommitted lockfile candidate for human review
        if: steps.lock.outputs.committed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-candidate
          path: |
            package-lock.json
            package-lock.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Collect npm vulnerability audit evidence
        shell: bash
        run: |
          trap 'rm -f npm-audit.raw.json' EXIT
          set +e
          npm audit --json --audit-level=low > npm-audit.raw.json
          audit_exit=$?
          set -e
          node scripts/summarize-npm-audit.mjs "$audit_exit"
      - name: Upload sanitized npm audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-summary
          path: npm-audit-summary.json
          if-no-files-found: warn
          retention-days: 7
